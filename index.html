<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIST Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Yana Kaydırma (Swipe) Kütüphanesi -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- CSS Dosyası (Versiyon kırma parametreli) -->
    <link rel="stylesheet" href="stil.css?v=2">
</head>
<body>
    <div class="header">
        <div class="user-info">
            <span id="user-name">Merhaba!</span>
            <div class="status-box">
                <span id="market-time">00:00:00</span>
                <span id="market-status" class="status-badge">KAPALI</span>
            </div>
        </div>

        <input type="text" id="search-input" placeholder="Hisse Ara (Örn: THYAO, SASA)..." oninput="filterStocks()">
    </div>

    <!-- Swiper Yana Kaydırmalı Liste Konteyneri -->
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            <!-- Liste 1 -->
            <div class="swiper-slide">
                <div class="list-header">
                    <h3 id="title-list1" onclick="renameList(0)">⭐ Liste 1 ✏️</h3>
                </div>
                <div class="stock-list" id="container-list1"></div>
            </div>
            <!-- Liste 2 -->
            <div class="swiper-slide">
                <div class="list-header">
                    <h3 id="title-list2" onclick="renameList(1)">💼 Liste 2 ✏️</h3>
                </div>
                <div class="stock-list" id="container-list2"></div>
            </div>
            <!-- Liste 3 -->
            <div class="swiper-slide">
                <div class="list-header">
                    <h3 id="title-list3" onclick="renameList(2)">🚀 Liste 3 ✏️</h3>
                </div>
                <div class="stock-list" id="container-list3"></div>
            </div>
        </div>
        <!-- Sayfa Noktaları -->
        <div class="swiper-pagination"></div>
    </div>

    <!-- ALT KISIM: ANLIK HABER AKIŞI -->
    <div class="news-section">
        <div class="news-header">
            <h3>📰 Anlık Borsa & Ekonomi Haberleri</h3>
            <span class="live-dot">● CANLI</span>
        </div>
        <div class="news-container" id="news-container">
            <div class="loading">Haber akışı yükleniyor...</div>
        </div>
    </div>

    <!-- JS Dosyası (Versiyon kırma parametreli) -->
    <script src="uygulama.js?v=2"></script>
</body>
</html>
