<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIST Anlık Takip</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="user-info">
            <span id="user-name">BIST Takip</span>
            <span class="live-badge">LIVE</span>
        </div>
        <input type="text" id="search-input" placeholder="Hisse Ara (Örn: THYAO)..." onkeyup="filterStocks()">
    </div>

    <div class="stock-list" id="stock-container">
        <!-- Hisse kartları JavaScript ile buraya canlı yüklenecek -->
        <div class="loading">Veriler yükleniyor...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
