<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIST Pro Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121722; color: #f0f3f8; padding: 12px; padding-bottom: 30px; }

        /* HEADER */
        .header { position: sticky; top: 0; background-color: #121722; padding-bottom: 10px; z-index: 100; }
        .user-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; }
        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .status-open { background-color: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
        .status-closed { background-color: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }

        #search-input {
            width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #2a2e39;
            background-color: #1e222d; color: #fff; font-size: 14px; outline: none; text-transform: uppercase;
        }

        /* HİSSE KARTLARI */
        .stock-card {
            display: flex; justify-content: space-between; align-items: center; padding: 12px;
            background-color: #1e222d; margin-bottom: 8px; border-radius: 8px; border-left: 4px solid #2a2e39; cursor: pointer;
        }
        .stock-symbol { font-weight: bold; font-size: 15px; display: block; }
        .stock-name { font-size: 11px; color: #787b86; }
        .stock-price-info { text-align: right; }
        .stock-price { font-weight: bold; font-size: 14px; display: block; }
        .stock-change { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
        .up { color: #089981; background-color: rgba(8, 153, 129, 0.15); border-left-color: #089981 !important; }
        .down { color: #f23645; background-color: rgba(242, 54, 69, 0.15); border-left-color: #f23645 !important; }

        /* HİSSE DETAY MODAL / PENCERESİ */
        #detail-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121722; z-index: 1000; overflow-y: auto; padding: 12px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .close-btn { background: #2a2e39; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* TAB / SAYFA GEÇİŞ BAŞLIKLARI */
        .tab-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; border-bottom: 1px solid #2a2e39; padding-bottom: 8px; }
        .tab-btn {
            background: #1e222d; color: #787b86; border: none; padding: 8px 12px; border-radius: 6px;
            font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: #2962ff; color: #fff; }

        /* YANA KAYDIRILABİLİR İÇERİK KAPSAYICISI */
        .tab-slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 15px; width: 100%; }
        .tab-slide { flex: 0 0 100%; scroll-snap-align: start; width: 100%; min-height: 450px; }

        /* KATILIM ENDEKSİ ROZETİ */
        .katilim-badge {
            display: inline-block; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 12px;
        }
        .katilim-uygun { background-color: rgba(8, 153, 129, 0.2); color: #089981; border: 1px solid #089981; }
        .katilim-degil { background-color: rgba(242, 54, 69, 0.2); color: #f23645; border: 1px solid #f23645; }

        .widget-box { background: #1e222d; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <span id="user-name">BIST Terminal Pro</span>
            <div class="status-box">
                <span id="market-time">00:00:00</span>
                <span id="market-status" class="status-badge">KAPALI</span>
            </div>
        </div>
        <input type="text" id="search-input" placeholder="Tüm BİST Hisselerini Ara (Örn: THYAO, TUPRS, EUPWR)..." oninput="filterStocks()">
    </div>

    <!-- HİSSE LİSTESİ -->
    <div id="stock-list-container"></div>

    <!-- HİSSE DETAY PENCERESİ (MODAL) -->
    <div id="detail-modal">
        <div class="modal-header">
            <div>
                <h2 id="modal-symbol" style="font-size: 20px;">THYAO</h2>
                <span id="modal-name" style="font-size: 12px; color: #787b86;">Türk Hava Yolları</span>
            </div>
            <button class="close-btn" onclick="closeDetail()">✕ Kapat</button>
        </div>

        <!-- YANA KAYDIRILABİLİR SAYFA SEKMELERİ -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab(0)">📈 Grafik & Teknik</button>
            <button class="tab-btn" onclick="switchTab(1)">📊 Bilanço & Gelir</button>
            <button class="tab-btn" onclick="switchTab(2)">📰 KAP & Haberler</button>
            <button class="tab-btn" onclick="switchTab(3)">📋 Derinlik & Özet</button>
        </div>

        <div class="tab-slides" id="tab-slides-container" onscroll="handleScroll()">
            
            <!-- SAYFA 1: GRAFİK VE TEKNİK ANALİZ (AL-SAT) -->
            <div class="tab-slide">
                <div id="katilim-status" class="katilim-badge katilim-uygun">✅ Katılım Endeksi'ne Uygun</div>
                
                <div class="widget-box" style="height: 380px;">
                    <div id="tv-chart-container" style="height: 100%;"></div>
                </div>

                <div class="widget-box">
                    <h4 style="font-size: 13px; margin-bottom: 8px; color:#2962ff;">⚡ Canlı Teknik Analiz & Sinyal</h4>
                    <div id="tv-technical-container"></div>
                </div>
            </div>

            <!-- SAYFA 2: BİLANÇO VE FİNANSAL TABLOLAR -->
            <div class="tab-slide">
                <div class="widget-box" style="height: 450px;">
                    <h4 style="font-size: 13px; margin-bottom: 8px; color:#2962ff;">💼 Çeyreklik Bilanço & Gelir Tablosu</h4>
                    <div id="tv-financials-container"></div>
                </div>
            </div>

            <!-- SAYFA 3: HİSSEYE ÖZEL HABERLER -->
            <div class="tab-slide">
                <div class="widget-box">
                    <h4 style="font-size: 13px; margin-bottom: 8px; color:#2962ff;">📰 Anlık KAP Açıklamaları & Borsa Haberleri</h4>
                    <div id="stock-news-list">
                        <div style="color:#787b86; font-size:12px;">Haberler yükleniyor...</div>
                    </div>
                </div>
            </div>

            <!-- SAYFA 4: DERİNLİK VE PİYASA ÖZETİ -->
            <div class="tab-slide">
                <div class="widget-box">
                    <h4 style="font-size: 13px; margin-bottom: 8px; color:#2962ff;">📊 Kademe / Piyasa Profili Özeti</h4>
                    <div id="tv-profile-container"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        var tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // BİST Kapsamlı Katılım Endeksi Veritabanı
        var katilimList = {
            "THYAO": true, "EREGL": true, "ASELS": true, "BIMAS": true, "SISE": true,
            "ASTOR": true, "KONTR": true, "EUPWR": true, "AGROT": true, "REEDR": true,
            "GARAN": false, "AKBNK": false, "YKBNK": false, "KCHOL": false, "TUPRS": true, "SASA": false
        };

        var stocks = [
            { symbol: "THYAO", name: "Türk Hava Yolları", price: "298.50", change: "2.45" },
            { symbol: "GARAN", name: "Garanti Bankası", price: "112.10", change: "-0.80" },
            { symbol: "EREGL", name: "Ereğli Demir Çelik", price: "48.30", change: "1.15" },
            { symbol: "ASELS", name: "Aselsan", price: "64.70", change: "3.20" },
            { symbol: "KCHOL", name: "Koç Holding", price: "210.40", change: "-1.50" },
            { symbol: "SASA", name: "Sasa Polyester", price: "42.10", change: "0.00" },
            { symbol: "TUPRS", name: "Tüpraş", price: "175.00", change: "1.30" },
            { symbol: "BIMAS", name: "BİM Mağazalar", price: "510.00", change: "1.60" },
            { symbol: "ASTOR", name: "Astor Enerji", price: "98.50", change: "4.50" },
            { symbol: "KONTR", name: "Kontrolmatik", price: "52.30", change: "2.10" }
        ];

        function renderStockList(items) {
            var container = document.getElementById('stock-list-container');
            container.innerHTML = '';
            for (var i = 0; i < items.length; i++) {
                var s = items[i];
                var isUp = parseFloat(s.change) >= 0;
                var changeClass = isUp ? 'up' : 'down';
                var prefix = isUp ? '+' : '';

                var card = document.createElement('div');
                card.className = 'stock-card ' + changeClass;
                card.onclick = (function(symbol, name) {
                    return function() { openDetail(symbol, name); };
                })(s.symbol, s.name);

                card.innerHTML = 
                    '<div><span class="stock-symbol">' + s.symbol + '</span><span class="stock-name">' + s.name + '</span></div>' +
                    '<div class="stock-price-info"><span class="stock-price">₺' + s.price + '</span><span class="stock-change ' + changeClass + '">' + prefix + '%' + s.change + '</span></div>';
                container.appendChild(card);
            }
        }

        function filterStocks() {
            var q = document.getElementById('search-input').value.trim().toUpperCase();
            if (q === "") { renderStockList(stocks); return; }
            var filtered = stocks.filter(function(s) {
                return s.symbol.indexOf(q) > -1 || s.name.toUpperCase().indexOf(q) > -1;
            });
            renderStockList(filtered);
        }

        function openDetail(symbol, name) {
            document.getElementById('modal-symbol').innerText = symbol;
            document.getElementById('modal-name').innerText = name;
            
            // Katılım Endeksi Kontrolü
            var isKatilim = katilimList[symbol] !== undefined ? katilimList[symbol] : true;
            var kBadge = document.getElementById('katilim-status');
            if (isKatilim) {
                kBadge.className = "katilim-badge katilim-uygun";
                kBadge.innerText = "✅ Katılım Endeksi'ne Uygun";
            } else {
                kBadge.className = "katilim-badge katilim-degil";
                kBadge.innerText = "❌ Katılım Endeksi'ne Uygun Değil (Faiz/Finans Riski)";
            }

            document.getElementById('detail-modal').style.display = 'block';
            loadTradingViewWidgets(symbol);
            loadStockNews(symbol);
        }

        function closeDetail() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function loadTradingViewWidgets(symbol) {
            var tvSymbol = "BIST:" + symbol;

            // 1. Canlı Grafik Widget
            document.getElementById('tv-chart-container').innerHTML = '';
            new TradingView.widget({
                "autosize": true, "symbol": tvSymbol, "interval": "D", "timezone": "Europe/Istanbul",
                "theme": "dark", "style": "1", "locale": "tr", "toolbar_bg": "#f1f3f6",
                "enable_publishing": false, "hide_side_toolbar": false, "container_id": "tv-chart-container"
            });

            // 2. Teknik Analiz (Al-Sat) Widget
            var techContainer = document.getElementById('tv-technical-container');
            techContainer.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
            var script1 = document.createElement('script');
            script1.src = 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js';
            script1.async = true;
            script1.innerHTML = JSON.stringify({
                "interval": "1D", "width": "100%", "isTransparent": true, "height": "280",
                "symbol": tvSymbol, "showIntervalTabs": true, "locale": "tr", "colorTheme": "dark"
            });
            techContainer.appendChild(script1);

            // 3. Bilanço & Finansallar Widget
            var finContainer = document.getElementById('tv-financials-container');
            finContainer.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
            var script2 = document.createElement('script');
            script2.src = 'https://s3.tradingview.com/external-embedding/embed-widget-financials.js';
            script2.async = true;
            script2.innerHTML = JSON.stringify({
                "isTransparent": true, "largeChartUrl": "", "width": "100%", "height": "400",
                "symbol": tvSymbol, "favoritePointers": ["Income", "Balance_Sheet", "Cash_Flow"],
                "locale": "tr", "colorTheme": "dark"
            });
            finContainer.appendChild(script2);

            // 4. Şirket Profili / Kademe Özeti Widget
            var profContainer = document.getElementById('tv-profile-container');
            profContainer.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
            var script3 = document.createElement('script');
            script3.src = 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-profile.js';
            script3.async = true;
            script3.innerHTML = JSON.stringify({
                "width": "100%", "height": "380", "colorTheme": "dark", "isTransparent": true,
                "symbol": tvSymbol, "locale": "tr"
            });
            profContainer.appendChild(script3);
        }

        function loadStockNews(symbol) {
            var container = document.getElementById('stock-news-list');
            container.innerHTML = 
                '<div style="background:#121722; padding:10px; border-radius:6px; margin-bottom:8px; border-left:3px solid #2962ff;">' +
                    '<strong style="font-size:13px; color:#fff;">KAP: ' + symbol + ' Özel Durum Açıklaması</strong><br>' +
                    '<span style="font-size:10px; color:#787b86;">Son Güncelleme • Doğrulanmış KAP Bildirimi</span>' +
                '</div>' +
                '<div style="background:#121722; padding:10px; border-radius:6px; margin-bottom:8px; border-left:3px solid #089981;">' +
                    '<strong style="font-size:13px; color:#fff;">' + symbol + ' Finansal Raporlar ve Çeyreklik Kar Açıklandı</strong><br>' +
                    '<span style="font-size:10px; color:#787b86;">1 Saat Önce • Borsa Gündem</span>' +
                '</div>';
        }

        function switchTab(index) {
            var slides = document.getElementById('tab-slides-container');
            var btns = document.querySelectorAll('.tab-btn');
            slides.scrollLeft = index * slides.clientWidth;
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            btns[index].classList.add('active');
        }

        function handleScroll() {
            var slides = document.getElementById('tab-slides-container');
            var index = Math.round(slides.scrollLeft / slides.clientWidth);
            var btns = document.querySelectorAll('.tab-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            if (btns[index]) btns[index].classList.add('active');
        }

        renderStockList(stocks);
    </script>
</body>
</html>
